name: demo reset

# Puts the public demo back: whatever visitors changed goes, and the report gets a fresh week of
# made-up sales. There is no push or pull_request trigger on purpose, so a fork or a PR cannot run
# this, and the job also checks where it is running.
on:
  schedule:
    # Sunday 19:23 UTC is Monday 02:23 in Jakarta, when nobody is using the till.
    - cron: '23 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    if: github.repository == 'ramaraihan12/warung-pos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The connection string is only given to this step, not to the install above.
      - run: pnpm db:seed -- --reset --history
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
